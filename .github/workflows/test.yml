name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # The suite (258 files, 1600+ tests) takes ~295s on ubuntu-latest, so a
    # 5-minute budget cancelled an otherwise-passing run during post-cleanup.
    # Match the smoke job's headroom.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck runtime and release scripts
        run: bun run typecheck:runtime

      - name: Lint TypeScript and React sources
        run: bun run lint

      - name: Refuse vulnerable dependencies
        run: bun run supply-chain:audit

      - name: Verify production dependency licenses
        run: bun run supply-chain:licenses

      - name: Run tests
        run: bun test

  app-production-build:
    name: cockpit production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Test cockpit
        run: bun run cockpit:test
      - name: Build cockpit
        run: bun run cockpit:build

  windows-root-safety:
    name: Windows restore and cleanup safety
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run native Windows restore and cleanup tests
        run: bun test tests/unit/system-restore-target-guard.test.ts tests/unit/windows-filesystem-safety.test.ts

  container-integration:
    name: container readiness and persisted restart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Build and verify the local container profile
        run: bun run container:test
      - name: Verify two clean builds are byte-identical by OCI content identity
        run: bun run container:reproducibility
